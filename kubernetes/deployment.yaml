apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-api
  namespace: mlops-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: equipment-api
  template:
    metadata:
      labels:
        app: equipment-api
    spec:
      containers:
        - name: api
          image: production-ml-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: equipment-api-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
