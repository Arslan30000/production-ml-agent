name: Python checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,api]'
      - name: Lint
        run: python -m ruff check agent api dags scripts tests training
      - name: Test
        run: python -m pytest -q
