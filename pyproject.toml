[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-ml-agent"
version = "0.1.0"
description = "Evidence-driven MLOps operations agent"
requires-python = ">=3.11"
dependencies = ["dvc>=3,<5", "mlflow>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
airflow = ["apache-airflow>=3,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["agent*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
